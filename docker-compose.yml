name: caderno-de-campo

# Arquitetura:
#   Internet -> nginx (única porta publicada) -> frontend (React estático)
#                                             -> backend (Node/Express) -> mysql
# A rede "rede_interna" é "internal": nada nela é acessível de fora do Docker.
# Somente o nginx participa também da "rede_publica", por isso só ele recebe tráfego externo.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cdc-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - rede_publica
      - rede_interna
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cdc-frontend
    networks:
      - rede_interna
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cdc-backend
    environment:
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      DB_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rede_interna
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: cdc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down" e a reinícios.
      - mysql_data:/var/lib/mysql
      # Script de criação das tabelas (executado só na primeira inicialização do volume).
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rede_interna
    restart: unless-stopped

networks:
  rede_publica:
    driver: bridge
  rede_interna:
    driver: bridge
    internal: true

volumes:
  mysql_data:
